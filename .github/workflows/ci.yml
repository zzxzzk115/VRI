name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Enforce clang-format over source/, examples/, tests/ (one unified standard, the root
  # .clang-format). Pinned to 20.1.0 so CI and local `clang-format` agree exactly. Generated
  # shader headers (tests/shaders/) and the Objective-C++ Metal backend are exempt via their own
  # DisableFormat .clang-format files; the C ABI-cleanliness file (.c) is skipped (Language: Cpp).
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format 20.1.0
        run: pip install clang-format==20.1.0
      - name: Check formatting (source/ examples/ tests/)
        run: |
          files=$(git ls-files source examples tests | grep -E '\.(cpp|cc|h|hpp)$')
          echo "$files" | xargs clang-format --dry-run --Werror

  # Compile every backend and run the doctest suite. GPU backends self-skip when no
  # device is available, so this is a reliable compile-and-run gate; on Linux we
  # install Mesa's software rasterizers (lavapipe / llvmpipe) so Vulkan + GL + WebGPU
  # actually render headless under Xvfb.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install Linux deps (software GL/Vulkan + headless X)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libglu1-mesa-dev \
            mesa-vulkan-drivers libgl1-mesa-dri \
            xvfb

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure
        run: >-
          xmake f -y -m release
          -p ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          --vri_backend_vulkan=y --vri_backend_wgpu=y --vri_backend_gl=y --vri_backend_d3d12=y
          --vri_build_tests=y --vri_build_tools=n --vri_build_examples=y

      - name: Build
        run: xmake build -y vri-tests

      # Compile gate for the full example set. Every example is set_default(false), so this
      # aggregate phony target is the one handle that compiles them all - a shader-header or
      # public-API regression that only surfaces in an example now fails CI at build time
      # instead of waiting for someone to run it by hand. The committed shader headers
      # (shaders/common/*.h) are compiled here against the current API.
      - name: Build examples (compile gate)
        run: xmake build -y vri-examples

      - name: Test (Linux, headless via Xvfb + software rasterizers)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a xmake run vri-tests

      # Smoke-run a small, reliable subset of examples headless under lavapipe/llvmpipe
      # (Vulkan + software GL). A few presented frames each with VRI_MAX_FRAMES, with the
      # strict validation grep on, catches API/shader regressions that only manifest at
      # runtime. Kept to a representative subset (--only) so CI stays bounded; the full set
      # is still covered by the compile gate above.
      - name: Smoke examples (Linux, headless via Xvfb + software rasterizers)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: >-
          xvfb-run -a xmake examples
          --backend=vulkan,opengl --frames=3
          --only=triangle,cube,computeshader,offscreen

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: xmake run vri-tests

  # macOS: build + run gate. Verified green (build compiles on AppleClang; the test run
  # passes - GPU backends self-skip without a device/ICD: no MoltenVK Vulkan ICD here,
  # and desktop GL caps at 4.1 so compute/tessellation/GL_PATCHES are unavailable).
  macos:
    name: desktop (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          # This action builds components from source; MoltenVK isn't in its set. Headers
          # + loader are all the build needs - without a MoltenVK ICD, Vulkan finds no
          # device at runtime and self-skips (fine for the experimental macOS run).
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure
        run: >-
          xmake f -y -m release -p macosx
          --vri_backend_vulkan=y --vri_backend_wgpu=y --vri_backend_gl=y
          --vri_build_tests=y --vri_build_tools=n --vri_build_examples=n

      - name: Build (compile gate)
        run: xmake build -y vri-tests

      - name: Test (macOS - backends self-skip without a device)
        run: xmake run vri-tests

  # End-to-end WebGL: build the GL backend to wasm and render the triangle + UBO
  # triangle in headless Chrome (WebGL2 via SwiftShader - no GPU needed).
  webgl:
    name: webgl (emscripten + headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # xmake must be set up BEFORE emsdk: with EMSDK active the setup action
      # cross-builds xmake itself to wasm and fails. Install it first (host build).
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Configure (wasm)
        run: xmake f -y -p wasm --vri_backend_vulkan=n --vri_backend_wgpu=n --vri_backend_gl=y

      - name: Build WebGL E2E
        run: xmake build -y vri-webgl-triangle

      - name: Run headless (Chrome + SwiftShader)
        run: |
          set -o pipefail
          emrun \
            --browser="${{ steps.setup-chrome.outputs.chrome-path }}" \
            --browser_args="--headless=new --disable-gpu --use-angle=swiftshader --enable-unsafe-swiftshader --no-sandbox" \
            --kill_exit --timeout 90 \
            build/wasm/wasm32/release/vri-webgl-triangle.html 2>&1 | tee emrun.log
          echo "--- grading ---"
          grep -q "VRI_WEBGL_RESULT: PASS" emrun.log

  # End-to-end browser WebGPU: build the WebGPU backend to wasm (emdawnwebgpu) and
  # render the triangle in headless Chrome via Vulkan-SwiftShader (no GPU needed).
  webgpu:
    name: webgpu (emscripten + headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Configure (wasm)
        run: xmake f -y -p wasm --vri_backend_vulkan=n --vri_backend_wgpu=y --vri_backend_gl=n

      - name: Build WebGPU E2E
        run: xmake build -y vri-webgpu-triangle

      - name: Run headless (Chrome + WebGPU/SwiftShader)
        run: |
          set -o pipefail
          emrun \
            --browser="${{ steps.setup-chrome.outputs.chrome-path }}" \
            --browser_args="--headless=new --enable-unsafe-webgpu --enable-features=Vulkan --enable-unsafe-swiftshader --no-sandbox --disable-gpu-sandbox" \
            --kill_exit --timeout 90 \
            build/wasm/wasm32/release/vri-webgpu-triangle.html 2>&1 | tee emrun.log
          echo "--- grading ---"
          grep -q "VRI_WEBGPU_RESULT: PASS" emrun.log
