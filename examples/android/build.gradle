// The APK around one example's shared library; `xmake apk <target>` stages this project with the
// library under jniLibs/<abi> and the example's files under assets/, then runs assembleDebug.
plugins {
    id 'com.android.application' version '9.5.1'
}

android {
    namespace 'org.vri.example'
    compileSdk 37
    defaultConfig {
        applicationId project.property('vriApplicationId')
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1'
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['jniLibs']
        assets.srcDirs = ['assets']
    }
    packaging {
        jniLibs.useLegacyPackaging = false
    }
}

dependencies {
    // The Java half of the native GameActivity the examples link (xmake/xmake-repo/packages/g/game-activity).
    implementation 'androidx.games:games-activity:4.4.2'
    // GameActivity extends AppCompatActivity but its POM does not declare AppCompat; the Kotlin BOM
    // aligns AppCompat's transitive standard-library variants.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
